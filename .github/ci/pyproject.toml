[project]
name = "ukci"
version = "0"
description = "catalog-core CI: test Unikraft PRs on the catalog apps"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ukci"]

[tool.uv]
exclude-newer = "2026-11-08T00:00:00Z"
