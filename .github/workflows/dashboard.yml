name: dashboard

# Publishes the CI dashboard (GitHub Pages) from the ci-data branch after
# every catalog-test run. Requires Pages with source "GitHub Actions".

on:
  workflow_run:  # zizmor: ignore[dangerous-triggers] -- uses nothing from the triggering run; reads main + ci-data only
    workflows: [catalog-test]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ci-data
          path: ci-data
          persist-credentials: false

      - name: Build
        env:
          PYTHONPATH: .github/ci
        run: python3 -m ukci dashboard --data ci-data --out site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
