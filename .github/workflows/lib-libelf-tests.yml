name: lib-libelf-tests

on:
  repository_dispatch:
    types: [libelf_open_pr]
  workflow_dispatch:
    inputs:
      compilers:
        description: 'JSON array of compilers to test, e.g. ["gcc","clang"]'
        required: false
        default: '["gcc","clang"]'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.pr_repo }}-${{ github.event.client_payload.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  test-libelf-apps:
    uses: ./.github/workflows/_reusable-test-suite.yml
    with:
      mode: libelf
      compilers: ${{ inputs.compilers || '["gcc","clang"]' }}
      dep_repo_path: repos/libs/libelf
      display_name: "catalog-core / lib-libelf-tests"
    secrets: inherit
