name: lint

on:
  pull_request:
  push:
    branches: [ci/dev]

permissions: {}

env:
  DEV: uv run --frozen --project .github/ci

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Tests
        run: $DEV pytest -q .github/ci/tests
      - name: ruff
        working-directory: .github/ci
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: mypy
        working-directory: .github/ci
        run: uv run --frozen mypy
      - name: actionlint
        run: uvx --from actionlint-py==1.7.12.25 actionlint
      - name: shellcheck
        run: uvx --from shellcheck-py==0.10.0.1 shellcheck .github/ci/setup-host.sh setup.sh
      - name: zizmor
        run: uvx zizmor==1.32.0 --offline --min-severity medium .github/workflows/
