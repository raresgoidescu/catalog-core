name: lint

# CI must understand every app (dependencies and variants are read from the
# app directories), and the CI code and workflows must be clean.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

env:
  UKCI: uv run --frozen --project .github/ci python -m ukci
  DEV: uv run --frozen --project .github/ci --group dev

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false

      - name: Apps are understood by CI
        run: $UKCI lint

      - name: Tests
        run: $DEV pytest -q .github/ci/tests

      - name: ruff
        working-directory: .github/ci
        run: |
          uv run --frozen --group dev ruff check .
          uv run --frozen --group dev ruff format --check .

      - name: mypy
        working-directory: .github/ci
        run: uv run --frozen --group dev mypy

      - name: actionlint
        run: uvx --from actionlint-py==1.7.12.25 actionlint

      - name: shellcheck
        run: uvx --from shellcheck-py==0.10.0.1 shellcheck .github/ci/setup-host.sh setup.sh

      - name: zizmor
        run: uvx zizmor==1.32.0 --offline --min-severity medium .github/workflows/
