name: lint

# Checks that CI can understand every app (deps and variants are read from
# the app directories), plus the CI code and workflows themselves.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Apps are understood by CI
        env:
          PYTHONPATH: .github/ci
        run: python3 -m ukci lint

      - name: CI unit tests
        env:
          PYTHONPATH: .github/ci
        run: python3 -m unittest discover -s .github/ci/tests -t .github/ci -v

      - name: actionlint
        run: pipx run --spec actionlint-py==1.7.12.25 actionlint

      - name: zizmor
        run: pipx run zizmor==1.32.0 --offline --min-severity medium .github/workflows/
