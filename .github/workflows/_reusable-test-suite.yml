name: reusable-test-suite

on:
  workflow_call:
    inputs:
      branch:
        description: "Branch to clone/test (staging | stable)"
        required: false
        type: string
        default: "staging"
      mode:
        description: "musl | lwip | libelf | elfloader | all"
        required: true
        type: string
      compilers:
        description: >
          JSON array of compilers to test, e.g. '["gcc","clang"]'.
          Every app is tested once per entry, so a PR can't pass on one
          compiler and silently break on the other.
        required: false
        type: string
        default: '["gcc","clang"]'
      dep_repo_path:
        description: "Local clone path (relative to repo root) that use-pull-request.sh should check the triggering PR branch out into, e.g. repos/unikraft or repos/libs/musl."
        required: false
        type: string
        default: "repos/unikraft"
      display_name:
        description: "Human name for check runs / Discord, e.g. 'lib-musl-tests'"
        required: true
        type: string
      toolchain_image:
        description: "Optional pinned toolchain container (see docker/toolchains). Empty = install deps on the runner as before."
        required: false
        type: string
        default: ""
      apps_override:
        description: >
          JSON array of app names to test instead of the full mode-based
          list, e.g. '["c-hello"]'. Empty = use list-apps.sh as normal.
        required: false
        type: string
        default: ""
    secrets:
      PRIVATE_KEY:
        required: false
      DISCORD_WEBHOOK_URL:
        required: false

permissions: {}

jobs:
  setup:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      owner: ${{ steps.parse_repo.outputs.owner }}
      repo: ${{ steps.parse_repo.outputs.repo }}
      check_run_id: ${{ steps.create_check.outputs.result }}
      apps: ${{ steps.list_apps.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Parse Repository Info
        if: github.event_name == 'repository_dispatch'
        id: parse_repo
        env:
          PR_REPO: ${{ github.event.client_payload.pr_repo }}
        run: bash .github/scripts/utils/parse-repo.sh "$PR_REPO"

      - name: Generate GitHub App Token
        if: github.event_name == 'repository_dispatch'
        id: generate_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: ${{ steps.parse_repo.outputs.owner }}
          repositories: ${{ steps.parse_repo.outputs.repo }}
          permission-checks: write

      - name: Create Initial Check Run
        if: github.event_name == 'repository_dispatch'
        id: create_check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          OWNER: ${{ steps.parse_repo.outputs.owner }}
          REPO: ${{ steps.parse_repo.outputs.repo }}
          HEAD_SHA: ${{ github.event.client_payload.pr_sha }}
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          script: |
            const { OWNER, REPO, HEAD_SHA } = process.env;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data } = await github.rest.checks.create({
              owner: OWNER,
              repo: REPO,
              name: 'Catalog Core Tests',
              head_sha: HEAD_SHA,
              status: 'in_progress',
              output: {
                title: 'Tests are running...',
                summary: `The Unikraft Catalog Core tests have been triggered. [View Progress](${runUrl})`
              }
            });
            return data.id;

      - name: List apps for matrix
        id: list_apps
        env:
          APPS_OVERRIDE: ${{ inputs.apps_override }}
          MODE: ${{ inputs.mode }}
          PYTHONPATH: .github/ci
        run: |
          # Apps are discovered from their directories: an app is tested when
          # its setup.sh links the repository under test (unikraft = all).
          case "$MODE" in
            all)       changed=unikraft ;;
            elfloader) changed=apps/elfloader ;;
            *)         changed="libs/$MODE" ;;
          esac
          if [ -n "$APPS_OVERRIDE" ]; then
            apps="$APPS_OVERRIDE"
            echo "Using apps_override: $apps"
          else
            apps=$(python3 -m ukci apps --names --affected "$changed")
          fi
          if [ "$apps" = "[]" ]; then
            echo "::error::No app with tests links '$changed'"
            exit 1
          fi
          echo "Apps linking '$changed': $apps"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

      - name: Setup repositories
        env:
          BRANCH: ${{ inputs.branch }}
        run: ./setup.sh "$BRANCH"

      - name: Check out triggering pull request
        if: github.event_name == 'repository_dispatch'
        env:
          ROOT_REPO: ${{ github.event.client_payload.pr_repo }}
          ROOT_PR: ${{ github.event.client_payload.pr_number }}
          DEP_REPO_PATH: ${{ inputs.dep_repo_path }}
        run: |
          case "$ROOT_REPO" in
            */*) ;;
            *) echo "::error::Invalid repository '${ROOT_REPO}'"; exit 1 ;;
          esac
          case "$ROOT_PR" in
            ''|*[!0-9]*) echo "::error::Invalid pull request number '${ROOT_PR}'"; exit 1 ;;
          esac
          git -C "$DEP_REPO_PATH" fetch --force \
            "https://github.com/${ROOT_REPO}" \
            "refs/pull/${ROOT_PR}/head"
          git -C "$DEP_REPO_PATH" checkout --detach FETCH_HEAD

      - name: Archive repositories
        run: tar -czf repos.tar.gz repos

      - name: Upload repositories artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: catalog-core-repos-${{ github.run_id }}
          path: repos.tar.gz
          retention-days: 1

      - name: "Discord: notify started"
        # if: always() && github.event_name == 'schedule'
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          BRANCH: ${{ inputs.branch }}
          MODE: ${{ inputs.mode }}
          COMPILERS: ${{ inputs.compilers }}
        run: |
          bash .github/scripts/notify/discord-notify.sh started \
            "${DISPLAY_NAME} (branch=${BRANCH}, mode=${MODE}, compilers=${COMPILERS})"

  test:
    needs: setup
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 120
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.setup.outputs.apps) }}
        compiler: ${{ fromJson(inputs.compilers) }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        timeout-minutes: 3
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Download repositories artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: catalog-core-repos-${{ github.run_id }}

      - name: Extract repositories
        run: tar -xzf repos.tar.gz

      - name: Install Base Dependencies
        if: inputs.toolchain_image == ''
        timeout-minutes: 20
        run: bash .github/scripts/utils/retry.sh 10m 2 30s -- bash .github/scripts/setup/base-dependencies.sh

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        timeout-minutes: 5

      - name: Enable Docker Buildkit
        timeout-minutes: 2
        run: bash .github/scripts/setup/docker-setup.sh

      - name: Install Firecracker
        timeout-minutes: 12
        run: bash .github/scripts/utils/retry.sh 4m 3 15s -- bash .github/scripts/setup/firecracker-setup.sh

      - name: Setup QEMU Networking
        timeout-minutes: 2
        run: bash .github/scripts/setup/qemu-setup.sh

      - name: Collect tool versions
        if: matrix.compiler == fromJson(inputs.compilers)[0]  # only once per app, not once per compiler -- versions don't vary by compiler
        timeout-minutes: 5
        env:
          APP: ${{ matrix.app }}
        run: |
          bash .github/scripts/setup/collect-tool-versions.sh
          mv tool-versions.txt "tool-versions-${APP}.txt"

      - name: Run test for ${{ matrix.app }} (${{ matrix.compiler }})
        id: run-test
        timeout-minutes: 20
        env:
          APP: ${{ matrix.app }}
          COMPILER: ${{ matrix.compiler }}
          BRANCH: ${{ inputs.branch }}
        run: bash .github/scripts/tests/run-app-test.sh "$APP" "$COMPILER" "$BRANCH"

      - name: Namespace in-app log dir by compiler
        if: always()
        env:
          APP: ${{ matrix.app }}
          COMPILER: ${{ matrix.compiler }}
        run: |
          if [ -d "${APP}/.scripts/test/log" ]; then
            mv "${APP}/.scripts/test/log" "${APP}-${COMPILER}-log"
          fi

      - name: Upload per-app log
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: catalog-core-app-log-${{ matrix.app }}-${{ matrix.compiler }}-${{ github.run_id }}
          path: |
            app-output-${{ matrix.app }}-${{ matrix.compiler }}.log
            results-${{ matrix.app }}-${{ matrix.compiler }}.csv
            tool-versions-${{ matrix.app }}.txt
            ${{ matrix.app }}-${{ matrix.compiler }}-log/*
          retention-days: 7
          if-no-files-found: ignore

  aggregate:
    needs: [setup, test]
    if: always()
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Download all per-app logs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: catalog-core-app-log-*-${{ github.run_id }}
          merge-multiple: true

      - name: Aggregate results
        id: aggregate
        run: bash .github/scripts/tests/aggregate-results.sh

      # A token can't be handed over from the setup job: GitHub drops job
      # outputs that contain masked values. Mint a fresh one here.
      - name: Generate GitHub App Token
        if: always() && github.event_name == 'repository_dispatch'
        id: generate_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: ${{ needs.setup.outputs.owner }}
          repositories: ${{ needs.setup.outputs.repo }}
          permission-checks: write

      - name: Update Final Check Run
        if: always() && github.event_name == 'repository_dispatch'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RESULT: ${{ steps.aggregate.outputs.result }}
          TEST_JOB_STATUS: ${{ needs.test.result }}
          OWNER: ${{ needs.setup.outputs.owner }}
          REPO: ${{ needs.setup.outputs.repo }}
          CHECK_RUN_ID: ${{ needs.setup.outputs.check_run_id }}
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          script: |
            const { RESULT, TEST_JOB_STATUS, OWNER, REPO, CHECK_RUN_ID } = process.env;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const conclusion = RESULT === 'success'
              ? 'success'
              : (TEST_JOB_STATUS === 'cancelled' ? 'cancelled' : 'failure');

            await github.rest.checks.update({
              owner: OWNER,
              repo: REPO,
              check_run_id: Number(CHECK_RUN_ID),
              status: 'completed',
              conclusion: conclusion,
              output: {
                title: `Check Status: ${conclusion}`,
                summary: `The Catalog Core tests have finished. [View Full Logs](${runUrl})`
              }
            });

      - name: Generate Workflow Summary
        if: always()
        run: bash .github/scripts/utils/generate-summary.sh

      - name: "Discord: notify final result"
        # if: always() && (github.event_name == 'schedule' || steps.aggregate.outputs.result == 'failure')
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_THREAD_ID: ${{ vars.DISCORD_THREAD_ID }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
          RESULT: ${{ steps.aggregate.outputs.result }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          BRANCH: ${{ inputs.branch }}
          MODE: ${{ inputs.mode }}
        run: |
          summary=$(python3 .github/scripts/tests/render-summary.py \
            --csv results.csv --discord-summary)
          bash .github/scripts/notify/discord-notify.sh "$RESULT" \
            "${DISPLAY_NAME} (branch=${BRANCH}, mode=${MODE}) finished.
          \`\`\`
          $summary
          \`\`\`"

      - name: Archive test artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: catalog-core-test-logs-${{ github.run_id }}
          path: |
            output.log
            results.csv
            tool-versions.txt
            *-log/*
          retention-days: 28
