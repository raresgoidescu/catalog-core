name: reusable-test-suite

on:
  workflow_call:
    inputs:
      mode:
        description: "musl | lwip | libelf | elfloader | all"
        required: true
        type: string
      compilers:
        description: >
          JSON array of compilers to test against, e.g. '["gcc","clang"]'.
          Every app in this workflow's matrix is tested once per entry.
          This is deliberate: the original discrepancy between the
          scheduled test-all run (no CC set -> gcc default) and the
          per-library PR workflows (CC=clang hardcoded) meant a PR could
          pass on the compiler its own CI used and still fail on the
          scheduled sweep's compiler, or vice versa, with no single
          workflow ever catching both. Testing both compilers everywhere
          removes that gap instead of just picking one. See
          docs/toolchains.md.
        required: false
        type: string
        default: '["gcc","clang"]'
      dep_repo_path:
        description: "Local clone path (relative to repo root) that use-pull-request.sh should check the triggering PR branch out into, e.g. repos/libs/musl. Empty for test-all (unikraft core itself)."
        required: false
        type: string
        default: "repos/unikraft"
      display_name:
        description: "Human name for check runs / Discord, e.g. 'lib-musl-tests'"
        required: true
        type: string
      toolchain_image:
        description: "Optional pinned toolchain container (see docker/toolchains). Empty = install straight on the runner as before."
        required: false
        type: string
        default: ""

jobs:
  # ---------------------------------------------------------------------
  # 1) One-time setup: parse the dispatch payload, mint the GitHub App
  #    token, open the check run, and compute the app matrix. Also kicks
  #    off a "started" Discord notification.
  # ---------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.parse_repo.outputs.owner }}
      repo: ${{ steps.parse_repo.outputs.repo }}
      token: ${{ steps.generate_token.outputs.token }}
      check_run_id: ${{ steps.create_check.outputs.result }}
      apps: ${{ steps.list_apps.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Parse Repository Info
        if: github.event_name == 'repository_dispatch'
        id: parse_repo
        run: bash .github/scripts/utils/parse-repo.sh "${{ github.event.client_payload.pr_repo }}"

      - name: Generate GitHub App Token
        if: github.event_name == 'repository_dispatch'
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: ${{ steps.parse_repo.outputs.owner }}
          repositories: ${{ steps.parse_repo.outputs.repo }}

      - name: Create Initial Check Run
        if: github.event_name == 'repository_dispatch'
        id: create_check
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          script: |
            const { data } = await github.rest.checks.create({
              owner: '${{ steps.parse_repo.outputs.owner }}',
              repo: '${{ steps.parse_repo.outputs.repo }}',
              name: 'Catalog Core Tests',
              head_sha: '${{ github.event.client_payload.pr_sha }}',
              status: 'in_progress',
              output: {
                title: 'Tests are running...',
                summary: 'The Unikraft Catalog Core tests have been triggered. [View Progress](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
              }
            });
            return data.id;

      - name: List apps for matrix
        id: list_apps
        run: |
          apps=$(bash .github/scripts/tests/list-apps.sh "${{ inputs.mode }}")
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

      # - name: "Discord: notify started"
      #   if: always()
      #   env:
      #     DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      #   run: |
      #     bash .github/scripts/notify/discord-notify.sh started \
      #       "${{ inputs.display_name }} started for ${{ github.event.client_payload.pr_repo || github.repository }}${{ github.event.client_payload.pr_number && format('#{0}', github.event.client_payload.pr_number) || '' }} (mode=${{ inputs.mode }}, compilers=${{ inputs.compilers }})"

  # ---------------------------------------------------------------------
  # 2) One job per app, run in parallel by the matrix. Flavours within an
  #    app (qemu.x86_64, fc.arm64, xen.x86_64, ...) still run
  #    sequentially inside .scripts/test/all.sh -- only the apps
  #    themselves are parallelized, as requested. GitHub Actions gives
  #    each matrix leg its own isolated log stream, which also solves
  #    the "log output sync" problem for free -- no interleaving to
  #    manage by hand.
  # ---------------------------------------------------------------------
  test:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: false # Why?
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.setup.outputs.apps) }}
        compiler: ${{ fromJson(inputs.compilers) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Base Dependencies
        if: inputs.toolchain_image == ''
        run: bash .github/scripts/setup/base-dependencies.sh

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Enable Docker Buildkit
        run: bash .github/scripts/setup/docker-setup.sh

      - name: Install Firecracker
        run: bash .github/scripts/setup/firecracker-setup.sh

      - name: Setup QEMU Networking
        run: bash .github/scripts/setup/qemu-setup.sh

      - name: Checkout PR Branch
        if: github.event_name == 'repository_dispatch'
        run: bash .github/scripts/utils/use-pull-request.sh "${{ inputs.dep_repo_path }}" "${{ github.event.client_payload.pr_repo }}" "${{ github.event.client_payload.pr_number }}"

      # See item 3/4 of the CI upgrade: pick up `Depends-On:` /
      # `Depends on #N` references from the triggering PR body so a PR
      # that only makes sense alongside another unmerged PR (possibly in
      # a different repo) is tested against that PR's code too, instead
      # of against main/master.
      - name: Resolve cross-repo PR dependencies
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ needs.setup.outputs.token }}
        run: |
          bash .github/scripts/utils/resolve-depends-on.sh \
            "${{ github.event.client_payload.pr_repo }}" \
            "${{ github.event.client_payload.pr_number }}" \
            .github/scripts/utils/repo-map.txt

      - name: Run test for ${{ matrix.app }} (${{ matrix.compiler }})
        id: run-test
        run: bash .github/scripts/tests/run-app-test.sh "${{ matrix.app }}" "${{ matrix.compiler }}"

      - name: Namespace in-app log dir by compiler
        if: always()
        run: |
          if [ -d "${{ matrix.app }}/.scripts/test/log" ]; then
            mv "${{ matrix.app }}/.scripts/test/log" "${{ matrix.app }}-${{ matrix.compiler }}-log"
          fi

      - name: Upload per-app log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-core-app-log-${{ matrix.app }}-${{ matrix.compiler }}-${{ github.run_id }}
          path: |
            app-output-${{ matrix.app }}-${{ matrix.compiler }}.log
            ${{ matrix.app }}-${{ matrix.compiler }}-log/*
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # 3) Fan-in: gather every app's log into the same output.log format the
  #    old sequential runner produced, decide pass/fail, close out the
  #    check run, post the summary, and send the final Discord message.
  # ---------------------------------------------------------------------
  aggregate:
    needs: [setup, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download all per-app logs
        uses: actions/download-artifact@v4
        with:
          pattern: catalog-core-app-log-*-${{ github.run_id }}
          merge-multiple: true

      - name: Aggregate results
        id: aggregate
        run: bash .github/scripts/tests/aggregate-results.sh

      - name: Update Final Check Run
        if: always() && github.event_name == 'repository_dispatch'
        uses: actions/github-script@v7
        with:
          github-token: ${{ needs.setup.outputs.token }}
          script: |
            const result = '${{ steps.aggregate.outputs.result }}';
            const testJobStatus = '${{ needs.test.result }}';

            const conclusion = result === 'success'
              ? 'success'
              : (testJobStatus === 'cancelled' ? 'cancelled' : 'failure');

            await github.rest.checks.update({
              owner: '${{ needs.setup.outputs.owner }}',
              repo: '${{ needs.setup.outputs.repo }}',
              check_run_id: ${{ needs.setup.outputs.check_run_id }},
              status: 'completed',
              conclusion: conclusion,
              output: {
                title: `Check Status: ${conclusion}`,
                summary: `The Catalog Core tests have finished. [View Full Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`
              }
            });

      - name: Generate Workflow Summary
        if: always()
        run: bash .github/scripts/utils/generate-summary.sh

      # - name: "Discord: notify final result"
      #   if: always()
      #   env:
      #     DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      #   run: |
      #     summary=$(grep -E 'PASSED|FAILED' output.log | sort | uniq -c || true)
      #     bash .github/scripts/notify/discord-notify.sh "${{ steps.aggregate.outputs.result }}" "${{ inputs.display_name }} (mode=${{ inputs.mode }}) finished.
      #     \`\`\`
      #     $summary
      #     \`\`\`"

      - name: Archive test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-core-test-logs-${{ github.run_id }}
          path: |
            output.log
            *-log/*
          retention-days: 28
