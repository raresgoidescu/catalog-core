name: app-elfloader-tests

on:
  repository_dispatch:
    types: [elfloader_open_pr]
  workflow_dispatch:
    inputs:
      compilers:
        description: 'JSON array of compilers to test, e.g. ["gcc","clang"]'
        required: false
        default: '["gcc","clang"]'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.pr_repo }}-${{ github.event.client_payload.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  test-elfloader-apps:
    uses: ./.github/workflows/_reusable-test-suite.yml
    with:
      mode: elfloader
      compilers: ${{ inputs.compilers || '["gcc","clang"]' }}
      dep_repo_path: repos/apps/elfloader
      display_name: "catalog-core / app-elfloader-tests"
    secrets: inherit
