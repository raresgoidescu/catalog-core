name: catalog-core-dispatch

# Reusable workflow called by every dependency repo (unikraft, lib-*, app-*).
# It tells catalog-core "PR <repo>#<n> changed" (opened, pushed, description
# edited) or "someone commented `recheck` on it". No PR code is checked out
# or run here. The payload is only a pointer: catalog-core reads the PR and
# the comment back from the API and decides there whether to test, and who
# may ask for a recheck (CI_TRUSTED_ASSOCIATIONS).
#
# Caller, identical in every repo (.github/workflows/catalog-core-dispatch.yaml):
#
#   on:
#     pull_request_target:
#       types: [opened, synchronize, reopened, edited, ready_for_review]
#     issue_comment:
#       types: [created]
#   permissions: {}
#   jobs:
#     dispatch:
#       uses: unikraft/catalog-core/.github/workflows/dispatch.yml@main
#       secrets:
#         PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

on:
  workflow_call:
    secrets:
      PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  dispatch:
    # A PR event (not a draft, not an edit of the title only), or a `recheck` comment on a PR.
    if: >-
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft &&
       (github.event.action != 'edited' || github.event.changes.body != null ||
        github.event.changes.base != null)) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.comment.body == 'recheck')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: GitHub App token for catalog-core
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: catalog-core
          permission-contents: write   # what repository_dispatch requires

      - name: Notify catalog-core
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          COMMENT: ${{ github.event.comment.id || '' }}
        # A recheck re-tests this PR only; a change also re-tests the PRs that depend on it.
        run: |
          gh api --method POST "/repos/${OWNER}/catalog-core/dispatches" \
            -f event_type=catalog_pr -f "client_payload[repo]=${REPO}" -f "client_payload[number]=${NUMBER}" \
            -f "client_payload[comment]=${COMMENT}" -f "client_payload[cascade]=$([ -n "$COMMENT" ] && echo false || echo true)"
          echo "Sent catalog_pr for ${REPO}#${NUMBER} to ${OWNER}/catalog-core"
