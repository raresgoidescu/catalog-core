name: catalog-core-dispatch

on:
  workflow_call:
    secrets:
      PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  dispatch:
    if: >-
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft &&
       (github.event.action != 'edited' || github.event.changes.body != null ||
        github.event.changes.base != null)) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.comment.body == 'recheck' &&
       (contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) ||
        github.event.comment.user.login == github.event.issue.user.login))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check that an edit changed the dependencies
        id: edit
        env:
          ACTION: ${{ github.event.action }}
          BASE_CHANGED: ${{ github.event.changes.base != null }}
          OLD_BODY: ${{ github.event.changes.body.from }}
          NEW_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$ACTION" = edited ] && [ "$BASE_CHANGED" != true ]; then
            before=$(printf '%s\n' "$OLD_BODY" | tr -d '\r' | grep -i 'depends' || true)
            after=$(printf '%s\n' "$NEW_BODY" | tr -d '\r' | grep -i 'depends' || true)
            if [ "$before" = "$after" ]; then
              echo "The edit didn't change any dependency; not re-testing"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: GitHub App token for catalog-core
        id: token
        if: steps.edit.outputs.skip != 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: catalog-core
          permission-actions: write

      - name: Notify catalog-core
        if: steps.edit.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          COMMENT: ${{ github.event.comment.id || '' }}
        run: |
          branch=$(gh api "/repos/${OWNER}/catalog-core" --jq .default_branch)
          cascade=true
          if [ -n "$COMMENT" ]; then
            cascade=false
          fi
          gh workflow run catalog-test.yml -R "${OWNER}/catalog-core" --ref "$branch" \
            -f "repo=${REPO}" -f "number=${NUMBER}" -f "comment=${COMMENT}" -f "cascade=${cascade}"
          echo "Asked ${OWNER}/catalog-core to test ${REPO}#${NUMBER}"
