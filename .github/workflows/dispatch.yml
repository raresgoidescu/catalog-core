name: catalog-core-dispatch

# Reusable workflow called by every dependency repo (unikraft, lib-*, app-*)
# when a pull request changes. It only tells catalog-core "PR <repo>#<n>
# changed"; catalog-core re-reads everything else from the GitHub API and
# never trusts this payload. No PR code is checked out or run here.
#
# Caller (identical in every repo, .github/workflows/catalog-core.yaml):
#
#   on:
#     pull_request_target:
#       types: [opened, synchronize, reopened, edited, ready_for_review]
#   permissions: {}
#   jobs:
#     dispatch:
#       uses: unikraft/catalog-core/.github/workflows/dispatch.yml@main
#       secrets:
#         PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

on:
  workflow_call:
    secrets:
      PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  dispatch:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: GitHub App token for catalog-core
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: catalog-core
          permission-contents: write

      - name: Notify catalog-core
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          jq -n --arg repo "$REPO" --arg number "$NUMBER" \
            '{event_type: "catalog_pr", client_payload: {repo: $repo, number: $number}}' |
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/catalog-core/dispatches" \
            --data @-
          echo "Sent catalog_pr for ${REPO}#${NUMBER} to ${OWNER}/catalog-core"
