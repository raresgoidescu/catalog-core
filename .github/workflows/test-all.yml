name: test-all

on:
  schedule:
    - cron: '0 1 * * *'   # 1 AM UTC daily
  repository_dispatch:
    types: [unikraft_open_pr]  # Triggered by external PRs in the unikraft repository
  workflow_dispatch:      # Manual trigger
    inputs:
      compilers:
        description: 'JSON array of compilers to test, e.g. ["gcc","clang"]'
        required: false
        default: '["gcc","clang"]'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.pr_repo }}-${{ github.event.client_payload.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  test-all-apps:
    uses: ./.github/workflows/_reusable-test-suite.yml
    with:
      mode: all
      compilers: ${{ inputs.compilers || '["gcc","clang"]' }}
      dep_repo_path: repos/unikraft
      display_name: "catalog-core / test-all"
    secrets: inherit
