name: catalog-test

# Tests changes to Unikraft and its libraries on the apps in this repository.
#
#   plan    trusted   reads the GitHub API, resolves Depends-On, pins one
#                     commit per repo, picks the apps that link the changed
#                     repos. Never runs PR code.
#   test    untrusted runs PR code; holds no tokens or secrets. Needs a
#                     maintainer's approval if any PR author is not a member.
#   report  trusted   judges the results (regression vs. already broken
#                     vs. flaky) and finishes the "Catalog Core" check.
#
# Apps, their dependencies and variants are read from the app directories;
# see .github/ci/README.md.

on:
  repository_dispatch:
    # catalog_pr is sent by .github/workflows/dispatch.yml; the others by
    # older per-repo dispatchers and are accepted until those are replaced.
    types: [catalog_pr, unikraft_open_pr, musl_open_pr, lwip_open_pr, libelf_open_pr, elfloader_open_pr]
  pull_request:
    paths-ignore: ['**.md']
  schedule:
    - cron: '0 1 * * *'     # staging, nightly
    - cron: '0 3 * * 0'     # stable, weekly (CI_STABLE_SCHEDULE below)
  workflow_dispatch:
    inputs:
      channel:
        description: Branch of every dependency to test
        type: choice
        options: [staging, stable]
        default: staging
      apps:
        description: Comma-separated apps (empty = all apps with tests)
        type: string
        default: ''
      compilers:
        description: Comma-separated compilers
        type: string
        default: gcc,clang

permissions: {}

concurrency:
  group: >-
    catalog-test-${{ github.event.client_payload.repo || github.event.client_payload.pr_repo || github.event_name }}-${{
    github.event.client_payload.number || github.event.client_payload.pr_number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .github/ci
  # Scheduled runs test staging, except the one with this cron, which tests stable.
  CI_STABLE_SCHEDULE: '0 3 * * 0'

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ok: ${{ steps.plan.outputs.ok }}
      trusted: ${{ steps.plan.outputs.trusted }}
      cells: ${{ steps.plan.outputs.cells }}
      has_cells: ${{ steps.plan.outputs.has_cells }}
      catalog_repo: ${{ steps.plan.outputs.catalog_repo }}
      catalog_sha: ${{ steps.plan.outputs.catalog_sha }}
      check_id: ${{ steps.check.outputs.check_id }}
      root_repo_owner: ${{ steps.plan.outputs.root_repo_owner }}
      root_repo_name: ${{ steps.plan.outputs.root_repo_name }}
      check_repos: ${{ steps.plan.outputs.check_repos }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Planning only reads public data: the read-only GITHUB_TOKEN is enough.
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CI_TRUSTED_ASSOCIATIONS: ${{ vars.CI_TRUSTED_ASSOCIATIONS }}
          CI_MAX_DEP_PRS: ${{ vars.CI_MAX_DEP_PRS }}
        run: python3 -m ukci plan --out plan.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan
          path: plan.json
          retention-days: 14

      # The check goes on the root PR in a dependency repo; the token can
      # only write checks there. (catalog-core's own PRs need no check: the
      # workflow run shows up on them directly.)
      - name: GitHub App token
        id: token
        if: steps.plan.outputs.root_repo_name != '' && steps.plan.outputs.root_repo_name != 'catalog-core'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: ${{ steps.plan.outputs.root_repo_owner }}
          repositories: ${{ steps.plan.outputs.check_repos }}
          permission-checks: write

      - name: Post Catalog Core check
        id: check
        if: steps.token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: python3 -m ukci check-start --plan plan.json


  # A PR changed: re-test the PRs that were last tested together with it
  # (they depend on it). Those runs don't fan out again, so cycles end here.
  fan-out:
    needs: plan
    if: github.event_name == 'repository_dispatch' && needs.plan.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write     # repository_dispatch to this repository
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan

      - name: Re-test dependent PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m ukci fan-out --plan plan.json

  test:
    needs: plan
    if: needs.plan.outputs.ok == 'true' && needs.plan.outputs.has_cells == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions: {}
    # Runs of PRs from non-members wait here for a maintainer's approval.
    environment: ${{ needs.plan.outputs.trusted != 'true' && 'ci-needs-approval' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.cells) }}
    name: test (${{ matrix.app }}, ${{ matrix.compiler }})
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ needs.plan.outputs.catalog_repo }}
          ref: ${{ needs.plan.outputs.catalog_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan

      - name: Set up runner
        timeout-minutes: 20
        run: .github/ci/setup-host.sh

      - name: Run ${{ matrix.app }} (${{ matrix.compiler }})
        env:
          APP: ${{ matrix.app }}
          COMPILER: ${{ matrix.compiler }}
        run: python3 -m ukci run --plan plan.json --app "$APP" --compiler "$COMPILER" --out results

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-${{ matrix.app }}-${{ matrix.compiler }}
          path: results/
          retention-days: 14
          if-no-files-found: ignore

  report:
    needs: [plan, test]
    if: always() && needs.plan.outputs.ok == 'true' && needs.plan.outputs.has_cells == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write     # append results to the ci-data branch
      actions: read       # see whether a maintainer declined to run the tests
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          path: results

      - name: GitHub App token
        id: token
        if: needs.plan.outputs.check_id != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: ${{ needs.plan.outputs.root_repo_owner }}
          repositories: ${{ needs.plan.outputs.check_repos }}
          permission-checks: write

      - name: Judge results and finish the check
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          CHECK_ID: ${{ needs.plan.outputs.check_id }}
          TEST_RESULT: ${{ needs.test.result }}
          CI_DATA_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
        run: python3 -m ukci report --plan plan.json --results results --out verdicts.json --check-id "$CHECK_ID"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verdicts
          path: verdicts.json
          retention-days: 90
